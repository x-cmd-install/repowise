goel-04 in https://github.com/repowise-dev/repowise/pull/4151\n* fix(server): count job progress per phase so concurrent phases stay coherent by @jgt87 in https://github.com/repowise-dev/repowise/pull/4740\n* fix(health): measure named arrow functions as units and drop nested NLOC by @jgt87 in https://github.com/repowise-dev/repowise/pull/4619\n* fix(server): onboarding targets are production code files; template pages are not documentation (#4567) by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/4596\n* fix(workspace): keep a Go call to a service's root path as a consumer by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/4595\n* fix(workspace): match a concrete path segment to a route {param} by @Aman-goel-04 in https://github.com/repowise-dev/repowise/pull/4734\n* feat(mcp): report lines_total and note count on empty omission ref query (#4998) by @left-big-toe-of-oppenheimer in https://github.com/repowise-dev/repowise/pull/5018\n* feat(plugins): add a Cursor plugin for the Repowise MCP server by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5312\n* chore(registry): list the hosted MCP endpoint in server.json by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5311\n* fix(update): bind stage-resolved state types by @HengYangDS in https://github.com/repowise-dev/repowise/pull/5328\n* feat(embeddings): support Gemini Embedding 2 retrieval by @sera527 in https://github.com/repowise-dev/repowise/pull/5104\n* fix(cli): report missing lancedb in doctor when a real embedder is configured by @phatloi0010 in https://github.com/repowise-dev/repowise/pull/5236\n* fix(cli): fail update when sync base commit is unreachable in git history by @phatloi0010 in https://github.com/repowise-dev/repowise/pull/5238\n* fix(doctor): flag missing member state.json in workspace --repair by @AryanSingh2029 in https://github.com/repowise-dev/repowise/pull/5245\n* fix(coordinator): stop counting tombstones as pages in the drift report by @2233admin in https://github.com/repowise-dev/repowise/pull/5289\n* fix(plugins): align pre-modification skill name with directory name and enforce name/dir match by @Hardik01363 in https://github.com/repowise-dev/repowise/pull/5323\n* fix(decisions): merge into a decision confirmed with evidence by @nazarli-shabnam in https://github.com/repowise-dev/repowise/pull/5343\n* fix(cli): reject deterministic onboarding pages on generate --page (#5320) by @ANO3457 in https://github.com/repowise-dev/repowise/pull/5321\n* fix(mcp): add NO_HITS_RECOVERY_HINT to empty search_codebase concept replies by @Asymtode712 in https://github.com/repowise-dev/repowise/pull/5007\n* feat(mcp): keep a local tool latency log and show p50/p90 in status by @Asymtode712 in https://github.com/repowise-dev/repowise/pull/5022\n* feat(workspace): read Dapr pub/sub topics in Java, JS, Python and Go by @thymeed in https://github.com/repowise-dev/repowise/pull/4806\n* fix(gemini): include thinking tokens in output cost by @Vamsi-2581 in https://github.com/repowise-dev/repowise/pull/5165\n* fix(init): record decision mining cost in llm_costs and the init cost line by @RagedPanda in https://github.com/repowise-dev/repowise/pull/5174\n* fix(java): bind a static import to a method the named type inherits by @macholul in https://github.com/repowise-dev/repowise/pull/5190\n* fix(ingestion): treat method type variable as type parameter even when repo class shares name (#4972) by @karnavagarwal in https://github.com/repowise-dev/repowise/pull/5260\n* test(cli): restore embedder environment after serve seeding by @HengYangDS in https://github.com/repowise-dev/repowise/pull/5352\n* perf(update): patch the graph for documentation edits, adds and removals by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5282\n* perf(graph): cache per-file framework scans across updates by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/4894\n* perf(update): patch the graph when source files are added, removed or change surface by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5374\n* perf(graph): resolve each TS file's imports once per framework pass by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5375\n* fix(update): make an update write the same store as a fresh init by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5387\n* fix(workspace): close every repository index when closing is cancelled by @jsolemd in https://github.com/repowise-dev/repowise/pull/5386\n* feat(update): refresh Git history without rebuilding docs by @HengYangDS in https://github.com/repowise-dev/repowise/pull/5329\n* test(distill): isolate synchronous pricing transcript scans by @HengYangDS in https://github.com/repowise-dev/repowise/pull/5355\n* fix(update): refresh knowledge-graph entries for changed files and match init's commit coverage by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5395\n* perf(update): patch the graph when a doc is added or removed beside a same-stem file by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5396\n* fix(decisions): stop supersede aliasing the old id to its successor by @nightious in https://github.com/repowise-dev/repowise/pull/5332\n* fix(ingestion): read Astro <script src> and <link href> as imports by @nightious in https://github.com/repowise-dev/repowise/pull/4720\n* ci: stage Apex and COBOL grammars before the unit tests by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5400\n* fix(decisions): delete the stale supersede pointers older versions left by @nightious in https://github.com/repowise-dev/repowise/pull/5392\n* fix(mcp): serve an indexed non-member beside the workspace members as its own repo by @nightious in https://github.com/repowise-dev/repowise/pull/5336\n* fix: retry failed decision-mining sources from their own range by @msranjana in https://github.com/repowise-dev/repowise/pull/5096\n* fix(embedding): send the declared width to OpenRouter by @jgt87 in https://github.com/repowise-dev/repowise/pull/5383\n* perf(update): patch the graph for config edits that cannot change it by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5397\n* fix(reindex,doctor): keep tombstoned pages out of reindex and coordinator drift by @ggiannotti in https://github.com/repowise-dev/repowise/pull/3978\n* fix(decisions): apply folded keepers and skip superseded wording on import by @nightious in https://github.com/repowise-dev/repowise/pull/5393\n* docs(plugins): list community plugins, starting with the MarkItDown PDF extractor by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5398\n* feat(persistence): apply plugin storage revisions after the core schema by @jsolemd in https://github.com/repowise-dev/repowise/pull/5391\n* fix(decisions): list reaffirmed entries in the import summary by @nightious in https://github.com/repowise-dev/repowise/pull/5394\n* fix(grammars): retry transient grammar downloads and report the ones that fail by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5401\n* perf(ingestion): probe tsconfig alias candidates without a resolve per path by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5403\n* perf(git): reuse cached commit records by sha so updates diff only new commits by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5404\n* perf(update): keep files with no grammar from forcing a full graph rebuild by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5405\n* perf(update): stop re-scanning commits that store no commit-health row by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5406\n* perf(update): splice duplication in process and batch changed graph rows by @RaghavChamadiya in https://github.com/repowise-dev/repowise/pull/5407\n* test: make the post-commit hook fake install write atomically by @RaghavChamadiya in https://g